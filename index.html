<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="animation">        
        <div class="minion">
            <div class="minionbody">        
                <div class="body"></div>
                <div class="head"></div>
                <div class="mouth"></div>
                <div class="teeth-top"></div>
                <div class="teeth-bot"></div>
                <div class="arms left">
                    <div class="gloves"></div>
                </div>
                <div class="arms right">
                    <div class="gloves"></div>
                </div>

                <div class="legs left">
                    <div class="boots"></div>
                </div> 

                <div class="legs right">
                    <div class="boots"></div>
                </div>
            </div>
            <div class="goggleSet">
                <div class="gogglestrap"></div>
                <div class="goggle"></div>
                <div class="eyelid"></div>
                <div class="eye"></div>
                <div class="eye1"></div>
                <div class="eye2"></div>
            </div>
            <div class="clothing">
                <div class="clothbody"></div>
                <div class="strap left"></div>
                <div class="strap right"></div>
                <div class="clothbottom"></div>
            </div>
        </div>
    </div>

</body>
</html>
